<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · tools-call dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
background:#f5f6f8;color:#1f2328;font-size:14px;line-height:1.6;
min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:32px;width:340px}
h1{font-size:17px;font-weight:600;margin-bottom:20px;text-align:center}
label{display:block;font-size:12px;color:#6b7280;margin:12px 0 4px}
input{width:100%;background:#fff;color:#1f2328;border:1px solid #dcdfe5;
border-radius:6px;padding:8px 10px;font-size:14px;font-family:inherit}
input:focus{outline:none;border-color:#3b7ddd}
button{width:100%;margin-top:18px;background:#3b7ddd;color:#fff;font-weight:600;
border:1px solid #3b7ddd;border-radius:6px;padding:9px;font-size:14px;cursor:pointer;font-family:inherit}
button:hover{background:#2f6bc4}
button:disabled{opacity:.6;cursor:wait}
.err{color:#d4537e;font-size:13px;min-height:18px;margin-top:12px;text-align:center}
.pwwrap{position:relative;display:flex}
.pwwrap input{width:100%;padding-right:38px}
button.pweye{position:absolute;top:0;right:0;height:100%;width:36px;margin:0;
display:flex;align-items:center;justify-content:center;
border:none;background:transparent;cursor:pointer;padding:0;color:#9ca3af}
button.pweye:hover{background:transparent;color:#3b7ddd}
.pwwrap:focus-within .pweye{color:#3b7ddd}
.pweye svg{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>Agent 工具 / Skill 使用统计</h1>
  <form id="f">
    <label>用户名</label><input id="u" autocomplete="username" autofocus>
    <label>密码</label>
    <span class="pwwrap"><input id="p" type="password" autocomplete="current-password"><button type="button" class="pweye" id="eye-p" tabindex="-1"></button></span>
    <button type="submit" id="btn">登录</button>
    <div class="err" id="e"></div>
  </form>
</div>
<script>
const EYE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
const eyeBtn = document.getElementById("eye-p"), pwInput = document.getElementById("p");
eyeBtn.innerHTML = EYE;
eyeBtn.title = "显示密码";
eyeBtn.setAttribute("aria-label", "显示密码");
eyeBtn.onclick = () => {
  const show = pwInput.type === "password";
  pwInput.type = show ? "text" : "password";
  eyeBtn.innerHTML = show ? EYE_OFF : EYE;
  eyeBtn.title = show ? "隐藏密码" : "显示密码";
  eyeBtn.setAttribute("aria-label", eyeBtn.title);
};

const err = document.getElementById("e");
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.textContent = "";
  const btn = document.getElementById("btn");
  btn.disabled = true;
  try {
    const r = await fetch("/login", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value.trim(),
                             password: document.getElementById("p").value }) });
    if (r.ok) { window.location.href = "/dashboard"; return; }
    let detail = "登录失败";
    try { detail = (await r.json()).detail || detail; } catch {}
    err.textContent = detail;
  } catch {
    err.textContent = "网络错误，请重试";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
