<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tools-call dashboard</title>
<script src="/echarts"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
background:#f5f6f8;color:#1f2328;font-size:14px;line-height:1.6}
.wrap{max-width:1400px;margin:0 auto;padding:28px 24px 60px}
h1{font-size:22px;font-weight:600;margin-bottom:6px}
.sub{color:#6b7280;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sub a{color:#3b7ddd;text-decoration:none;cursor:pointer}
.sub a:hover{text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:600;line-height:1.2}
.kpi .l{color:#6b7280;font-size:12px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #e5e7eb;margin-bottom:22px;flex-wrap:wrap}
.tab{padding:9px 16px;cursor:pointer;border-radius:8px 8px 0 0;color:#6b7280;
font-size:14px;border:1px solid transparent;border-bottom:none;white-space:nowrap}
.tab:hover{background:#eef0f3}
.tab.on{background:#fff;color:#1f2328;font-weight:600;border-color:#e5e7eb;
margin-bottom:-1px;padding-bottom:10px}
.panel{display:none}.panel.on{display:block}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:18px}
.card .ttl{font-size:14px;font-weight:600;margin-bottom:14px;color:#31363c}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.chart{width:100%;height:360px}
.chart.sm{height:300px}
.chart.lg{height:460px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;background:#f7f8fa;color:#4b5563;font-weight:600;
border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f0f1f3;vertical-align:top}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:#3b7ddd;border-radius:4px}
.muted{color:#9ca3af;font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#eef2f7;
color:#4b5563;font-size:11px;margin-right:4px}
.empty{color:#9ca3af;padding:20px;text-align:center}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;font-size:13px;color:#6b7280}
select,input{background:#fff;color:#1f2328;border:1px solid #dcdfe5;
border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:#3b7ddd}
button{background:#fff;color:#1f2328;border:1px solid #dcdfe5;border-radius:6px;
padding:5px 14px;cursor:pointer;font-size:13px;font-family:inherit}
button:hover{background:#eef0f3}
button.primary{background:#3b7ddd;color:#fff;border-color:#3b7ddd}
button.primary:hover{background:#2f6bc4}
.opw{white-space:nowrap;margin-right:8px}
.rename-pen{color:#9ca3af;display:inline-flex;vertical-align:-2px;margin-left:6px}
.rename-pen:hover{color:#3b7ddd}
.pwwrap{position:relative;display:inline-flex}
.pwwrap input{padding-right:36px}
button.pweye{position:absolute;top:0;right:0;height:100%;width:34px;margin:0;
display:flex;align-items:center;justify-content:center;
border:none;background:transparent;cursor:pointer;padding:0;color:#9ca3af}
button.pweye:hover{background:transparent;color:#3b7ddd}
.pwwrap:focus-within .pweye{color:#3b7ddd}
.pweye svg{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>Agent 工具 / Skill 使用统计</h1>
  <div class="sub">
    <span>数据更新于 __GENERATED__</span>
    <label><input type="checkbox" id="auto" checked> 30s 自动刷新</label>
    <button onclick="load()">刷新</button>
    <span id="user-box"></span>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="v" id="k-total">-</div><div class="l">总记录数</div></div>
    <div class="kpi"><div class="v" id="k-clients">-</div><div class="l">Client 数</div></div>
    <div class="kpi" id="k-users-card"><div class="v" id="k-users">-</div><div class="l">上传数据的用户数</div></div>
    <div class="kpi"><div class="v" id="k-last" style="font-size:14px;padding-top:6px">-</div><div class="l">最新记录时间</div></div>
  </div>

  <div class="tabs">
    <div class="tab on" data-tab="overview">总览</div>
    <div class="tab" data-tab="tool">Tool 分析</div>
    <div class="tab" data-tab="skill">Skill 分析</div>
    <div class="tab" data-tab="user" id="tab-user">用户分析</div>
    <div class="tab" data-tab="account">账号</div>
  </div>

  <div class="panel on" id="p-overview">
    <div class="card"><div class="ttl">每日记录趋势</div><div id="c-daily" class="chart"></div></div>
    <div class="grid2">
      <div class="card"><div class="ttl">工具调用次数</div><div id="c-tools" class="chart"></div></div>
      <div class="card"><div class="ttl">Top 10 Skills</div><div id="c-topskills" class="chart"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="ttl">工具明细</div><div id="t-tools"></div></div>
      <div class="card"><div class="ttl">Skill 明细</div><div id="t-skills"></div></div>
    </div>
  </div>

  <div class="panel" id="p-tool">
    <div class="card"><div class="ttl">Tool 按天调用明细</div>
      <div class="toolbar">
        <label id="tool-user-wrap">用户 <select id="tool-user-sel"><option value="__all__">全部用户</option></select></label>
        <label>Tool <select id="tool-sel"></select></label>
        <label>时间窗口
          <select id="days-sel">
            <option value="7">最近 7 天</option>
            <option value="14" selected>最近 14 天</option>
            <option value="30">最近 30 天</option>
            <option value="90">最近 90 天</option>
            <option value="180">最近半年</option>
            <option value="365">最近一年</option>
          </select>
        </label>
        <span class="muted" id="tool-hint"></span>
      </div>
      <div id="c-tool-daily" class="chart"></div>
    </div>
  </div>

  <div class="panel" id="p-skill">
    <div class="card"><div class="ttl">Skill 按天调用明细</div>
      <div class="toolbar">
        <label id="skill-user-wrap">用户 <select id="skill-user-sel"><option value="__all__">全部用户</option></select></label>
        <label>Skill <select id="skill-sel"></select></label>
        <label>时间窗口
          <select id="skill-days-sel">
            <option value="7">最近 7 天</option>
            <option value="14" selected>最近 14 天</option>
            <option value="30">最近 30 天</option>
            <option value="90">最近 90 天</option>
            <option value="180">最近半年</option>
            <option value="365">最近一年</option>
          </select>
        </label>
        <span class="muted" id="skill-hint"></span>
      </div>
      <div id="c-skill-daily" class="chart"></div>
    </div>
    <div class="card"><div class="ttl">Skill 调用次数（全部）</div><div id="c-skills-all" class="chart lg"></div></div>
  </div>

  <div class="panel" id="p-user">
    <div class="card"><div class="ttl">用户 × 工具调用</div>
      <div class="toolbar" id="user-sel-wrap">
        <label>用户 <select id="user-sel"><option value="__all__">全部用户</option></select></label>
        <span class="muted" id="user-hint"></span>
      </div>
      <div id="c-user-tools" class="chart lg"></div>
      <div id="t-users" style="margin-top:12px"></div>
    </div>
    <div class="card"><div class="ttl">用户 × Skill 调用</div>
      <div id="c-user-skills" class="chart lg"></div>
      <div id="t-user-skills" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="panel" id="p-account">
    <div class="card"><div class="ttl">修改我的密码</div>
      <div class="toolbar">
        <span class="pwwrap"><input id="pw-old" type="password" placeholder="旧密码" size="16" autocomplete="current-password"><button type="button" class="pweye" id="eye-pw-old" tabindex="-1"></button></span>
        <span class="pwwrap"><input id="pw-new" type="password" placeholder="新密码（至少 8 位）" size="20" autocomplete="new-password"><button type="button" class="pweye" id="eye-pw-new" tabindex="-1"></button></span>
        <button class="primary" id="pw-save">保存</button>
        <span class="muted" id="pw-msg"></span>
      </div>
    </div>
    <div class="card" id="admin-card" style="display:none"><div class="ttl">用户管理</div>
      <div class="toolbar">
        <input id="nu-name" placeholder="用户名（需与数据中的 user 字段一致）" size="30">
        <span class="pwwrap"><input id="nu-pass" type="password" placeholder="初始密码（至少 8 位）" size="20" autocomplete="new-password"><button type="button" class="pweye" id="eye-nu-pass" tabindex="-1"></button></span>
        <select id="nu-role"><option value="user">普通用户</option><option value="admin">管理员</option></select>
        <button class="primary" id="nu-add">添加用户</button>
        <span class="muted" id="admin-msg"></span>
      </div>
      <div id="t-admin"></div>
    </div>
  </div>
</div>

<script>
let DATA = __DATA__;
const USER = __USER__;
let isAdmin = !!(USER && USER.role === "admin");
let selectedUser = "__all__";

const esc = (s) => String(s == null ? "" : s).replace(/&/g, "\u0026amp;").replace(/</g, "\u0026lt;")
  .replace(/>/g, "\u0026gt;").replace(/"/g, "\u0026quot;").replace(/'/g, "\u0026#39;");

const PAL = ['#3b7ddd','#1d9e75','#e8a33d','#d4537e','#7f77dd','#43a7c4','#8fbf4d','#e07b58'];
const chartCache = {};

function draw(id, opt){
  let c = chartCache[id];
  if (!c){ c = echarts.init(document.getElementById(id)); chartCache[id] = c; }
  c.setOption(opt, true);
  return c;
}
function resizeAll(){ Object.values(chartCache).forEach(c => { try{ c.resize(); }catch(e){} }); }
window.addEventListener("resize", resizeAll);

function axisCommon(){
  return { axisLine:{lineStyle:{color:"#dcdfe5"}}, axisTick:{show:false},
           axisLabel:{color:"#6b7280",fontSize:11} };
}

function optBarH(rows, color){
  rows = rows.slice().sort((a,b) => a.n - b.n);
  const total = rows.reduce((s,r) => s + r.n, 0) || 1;
  return {
    grid:{left:8,right:56,top:10,bottom:8,containLabel:true},
    tooltip:{trigger:"item",formatter:p => esc(p.name) + "<br/>" + p.value + " 次（" + (p.value/total*100).toFixed(1) + "%）"},
    xAxis:Object.assign({type:"value",splitLine:{lineStyle:{color:"#f0f1f3"}}}, axisCommon()),
    yAxis:Object.assign({type:"category",data:rows.map(r => r.name)}, axisCommon()),
    series:[{type:"bar",barMaxWidth:20,
      data:rows.map(r => ({value:r.n, itemStyle:{color:color||PAL[0], borderRadius:[0,4,4,0]}})),
      label:{show:true,position:"right",fontSize:11,color:"#4b5563",formatter:p => p.value}}]
  };
}

function optLine(buckets, values){
  return {
    grid:{left:8,right:24,top:24,bottom:8,containLabel:true},
    tooltip:{trigger:"axis",formatter:ps => ps.map(p => esc(p.name) + " " + p.value).join("<br/>")},
    xAxis:Object.assign({type:"category",data:buckets,boundaryGap:false}, axisCommon()),
    yAxis:Object.assign({type:"value",minInterval:1,splitLine:{lineStyle:{color:"#f0f1f3"}}}, axisCommon()),
    series:[{type:"line",smooth:true,symbolSize:6,data:values,itemStyle:{color:PAL[0]},
      areaStyle:{color:"rgba(59,125,221,0.12)"},
      label:{show:true,fontSize:10,color:"#6b7280",formatter:p => p.value}}]
  };
}

function optStack(buckets, series){
  return {
    grid:{left:8,right:20,top:34,bottom:8,containLabel:true},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"},
      formatter:ps => esc(ps[0].name) + "<br/>" + ps.map(p => esc(p.seriesName) + " " + p.value).join("<br/>")},
    legend:{type:"scroll",top:0,textStyle:{fontSize:11,color:"#4b5563"},itemWidth:10,itemHeight:10},
    xAxis:Object.assign({type:"category",data:buckets}, axisCommon()),
    yAxis:Object.assign({type:"value",minInterval:1,splitLine:{lineStyle:{color:"#f0f1f3"}}}, axisCommon()),
    series:series.map((s,i) => ({name:s.name,type:"bar",stack:"a",barMaxWidth:38,
      itemStyle:{color:PAL[i % PAL.length]},data:s.data}))
  };
}

function tbl(rows, cols){
  if (!rows.length) return '<div class="empty">暂无数据</div>';
  const max = Math.max(...rows.map(r => r.n || 0)) || 1;
  let h = '<table><thead><tr>' +
    cols.map(c => '<th' + (c.num ? ' class="num"' : '') + '>' + c.t + '</th>').join("") +
    '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr>';
    cols.forEach(c => {
      if (c.bar){
        h += '<td style="width:120px"><div class="bar"><i style="width:' +
             (r.n / max * 100) + '%;background:' + (c.color || PAL[0]) + '"></i></div></td>';
      } else {
        h += '<td' + (c.num ? ' class="num"' : '') + '>' + (c.f ? c.f(r) : esc(r[c.k])) + '</td>';
      }
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}

const EYE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
const PEN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>';

function bindEye(btnId, inputId){
  const btn = document.getElementById(btnId), inp = document.getElementById(inputId);
  btn.innerHTML = EYE;
  btn.title = "显示密码";
  btn.setAttribute("aria-label", "显示密码");
  btn.onclick = () => {
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.innerHTML = show ? EYE_OFF : EYE;
    btn.title = show ? "隐藏密码" : "显示密码";
    btn.setAttribute("aria-label", btn.title);
  };
}
bindEye("eye-pw-old", "pw-old");
bindEye("eye-pw-new", "pw-new");
bindEye("eye-nu-pass", "nu-pass");

function knownUsers(d){
  return Object.entries(d.by_user || {}).filter(u => u[0] !== "<unknown>").sort((a,b) => b[1] - a[1]);
}

function lastNDays(n){
  const all = Object.keys(DATA.by_day || {}).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const anchor = all.length ? all[all.length - 1] : new Date().toISOString().slice(0, 10);
  const end = new Date(anchor + "T00:00:00Z");
  if (isNaN(end.getTime())) return [];
  const days = [];
  for (let i = n - 1; i >= 0; i--) days.push(new Date(end.getTime() - i * 86400000).toISOString().slice(0, 10));
  return days;
}

function renderKpis(d){
  document.getElementById("k-total").textContent = d.total;
  document.getElementById("k-clients").textContent =
    Object.keys(d.by_client || {}).filter(c => c !== "<unknown>").length;
  document.getElementById("k-users").textContent = knownUsers(d).length;
  document.getElementById("k-last").textContent = d.last_timestamp || "-";
}

function renderOverview(d){
  const days = Object.entries(d.by_day || {}).sort((a,b) => a[0].localeCompare(b[0]));
  draw("c-daily", optLine(days.map(p => p[0]), days.map(p => p[1])));
  const tools = Object.entries(d.by_tool || {}).map(([name, n]) => ({name, n}));
  const skills = Object.entries(d.by_skill || {}).map(([name, n]) => ({name, n}));
  draw("c-tools", optBarH(tools, PAL[0]));
  draw("c-topskills", optBarH(skills.slice(0, 10), PAL[1]));
  document.getElementById("t-tools").innerHTML = tbl(tools,
    [{t:"工具",k:"name"},{t:"次数",k:"n",num:true},{t:"",bar:true}]);
  document.getElementById("t-skills").innerHTML = tbl(skills,
    [{t:"Skill",k:"name"},{t:"次数",k:"n",num:true},{t:"",bar:true,color:PAL[1]}]);
}

function populateUserFilter(id, d){
  const sel = document.getElementById(id);
  const users = knownUsers(d);
  const cur = sel.value || "__all__";
  sel.innerHTML = '<option value="__all__">全部用户</option>' +
    users.map(([u]) => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
  sel.value = users.some(([u]) => u === cur) ? cur : "__all__";
}

function renderToolTab(d){
  populateUserFilter("tool-user-sel", d);
  const user = document.getElementById("tool-user-sel").value;
  const sel = document.getElementById("tool-sel");
  const names = user === "__all__" ? Object.keys(d.tool_days || {})
    : Object.keys((d.user_tool_days || {})[user] || {});
  const cur = sel.value;
  sel.innerHTML = names.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")
    || "<option value=''>（暂无 tool 数据）</option>";
  if (names.includes(cur)) sel.value = cur;
  const tool = sel.value;
  if (!tool) return;
  const n = parseInt(document.getElementById("days-sel").value, 10);
  const days = lastNDays(n);
  const perDay = user === "__all__" ? (d.tool_days || {})[tool] || {}
    : ((d.user_tool_days || {})[user] || {})[tool] || {};
  const values = days.map(x => perDay[x] || 0);
  const who = isAdmin ? (user === "__all__" ? "全部用户" : user) + " · " : "";
  document.getElementById("tool-hint").textContent =
    `${who}${tool} · 最近 ${n} 天共 ${values.reduce((a,b) => a+b, 0)} 次`;
  draw("c-tool-daily", optLine(days, values));
}

function renderSkillTab(d){
  populateUserFilter("skill-user-sel", d);
  const user = document.getElementById("skill-user-sel").value;
  const sel = document.getElementById("skill-sel");
  const names = user === "__all__" ? Object.keys(d.by_skill || {})
    : Object.keys((d.user_skill_days || {})[user] || {});
  const cur = sel.value;
  sel.innerHTML = names.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("")
    || "<option value=''>（暂无 skill 数据）</option>";
  if (names.includes(cur)) sel.value = cur;
  const skill = sel.value;
  if (skill){
    const n = parseInt(document.getElementById("skill-days-sel").value, 10);
    const days = lastNDays(n);
    const perDay = user === "__all__" ? (d.skill_days || {})[skill] || {}
      : ((d.user_skill_days || {})[user] || {})[skill] || {};
    const values = days.map(x => perDay[x] || 0);
    const who = isAdmin ? (user === "__all__" ? "全部用户" : user) + " · " : "";
    document.getElementById("skill-hint").textContent =
      `${who}${skill} · 最近 ${n} 天共 ${values.reduce((a,b) => a+b, 0)} 次`;
    draw("c-skill-daily", optLine(days, values));
  }
  const skills = Object.entries(d.by_skill || {}).map(([name, n]) => ({name, n}));
  draw("c-skills-all", optBarH(skills, PAL[1]));
}

function renderUserTab(d){
  const users = knownUsers(d);
  const userTools = d.user_tools || {}, userSkills = d.user_skills || {};
  const hint = document.getElementById("user-hint");
  let tOpt, sOpt, tRows, sRows;
  if (selectedUser === "__all__"){
    const shown = users.slice(0, 15).map(u => u[0]);
    hint.textContent = users.length > 15
      ? `显示调用最多的前 15 位（共 ${users.length} 位），可用下拉选择具体用户` : "";
    const toolTotals = {}, skillTotals = {};
    shown.forEach(u => Object.entries(userTools[u] || {}).forEach(([t, n]) => toolTotals[t] = (toolTotals[t] || 0) + n));
    shown.forEach(u => Object.entries(userSkills[u] || {}).forEach(([s, n]) => skillTotals[s] = (skillTotals[s] || 0) + n));
    const topTools = Object.entries(toolTotals).sort((a,b) => b[1] - a[1]).slice(0, 8).map(p => p[0]);
    const topSkills = Object.entries(skillTotals).sort((a,b) => b[1] - a[1]).slice(0, 8).map(p => p[0]);
    tOpt = optStack(shown, topTools.map(t => ({name:t, data:shown.map(u => (userTools[u] || {})[t] || 0)})));
    sOpt = optStack(shown, topSkills.map(s => ({name:s, data:shown.map(u => (userSkills[u] || {})[s] || 0)})));
    tRows = users.map(([u, total]) => ({name:u, n:total,
      detail:Object.entries(userTools[u] || {}).sort((a,b) => b[1] - a[1]).map(([t, n]) => `${t} ${n}`).join("，")}));
    sRows = users.map(([u]) => {
      const det = Object.entries(userSkills[u] || {}).sort((a,b) => b[1] - a[1]);
      return {name:u, n:det.reduce((s, x) => s + x[1], 0), detail:det.map(([s, n]) => `${s} ${n}`).join("，")};
    });
  } else {
    hint.textContent = "";
    const tools = Object.entries(userTools[selectedUser] || {}).sort((a,b) => b[1] - a[1]).map(([name, n]) => ({name, n}));
    const skills = Object.entries(userSkills[selectedUser] || {}).sort((a,b) => b[1] - a[1]).map(([name, n]) => ({name, n}));
    tOpt = optBarH(tools, PAL[0]);
    sOpt = optBarH(skills, PAL[1]);
    const uTotal = (users.find(u => u[0] === selectedUser) || [0, 0])[1];
    tRows = [{name:selectedUser, n:uTotal, detail:tools.map(t => `${t.name} ${t.n}`).join("，")}];
    sRows = [{name:selectedUser, n:skills.reduce((s, x) => s + x.n, 0),
      detail:skills.map(s => `${s.name} ${s.n}`).join("，")}];
  }
  draw("c-user-tools", tOpt);
  draw("c-user-skills", sOpt);
  document.getElementById("t-users").innerHTML = tbl(tRows,
    [{t:"用户",k:"name"},{t:"总调用",k:"n",num:true},
     {t:"各工具明细",k:"detail",f:r => esc(r.detail) || "-"},{t:"",bar:true}]);
  document.getElementById("t-user-skills").innerHTML = tbl(sRows,
    [{t:"用户",k:"name"},{t:"Skill 总数",k:"n",num:true},
     {t:"Skill 明细",k:"detail",f:r => esc(r.detail) || "-"},{t:"",bar:true,color:PAL[1]}]);
}

function populateUserSelect(d){
  if (!isAdmin){ selectedUser = USER.name; return; }
  const sel = document.getElementById("user-sel");
  const users = knownUsers(d);
  const cur = sel.value || "__all__";
  sel.innerHTML = '<option value="__all__">全部用户</option>' +
    users.map(([u]) => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
  sel.value = users.some(([u]) => u === cur) ? cur : "__all__";
  selectedUser = sel.value;
}

let activeTab = "overview";

function renderTabCharts(name, d){
  if (name === "overview") renderOverview(d);
  else if (name === "tool") renderToolTab(d);
  else if (name === "skill") renderSkillTab(d);
  else if (name === "user") renderUserTab(d);
}

function renderAll(d){
  renderKpis(d);
  populateUserSelect(d);
  populateUserFilter("tool-user-sel", d);
  populateUserFilter("skill-user-sel", d);
  renderTabCharts(activeTab, d);
}

function load(){
  fetch("/v1/stats").then(r => {
    if (r.status === 401){ window.location.href = "/login"; throw new Error("unauthorized"); }
    return r.json();
  }).then(d => { DATA = d; renderAll(d); }).catch(() => {});
}

async function api(url, body){
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401){ window.location.href = "/login"; throw new Error("unauthorized"); }
  return r;
}

function adminMsg(text, ok){
  const el = document.getElementById("admin-msg");
  el.textContent = text;
  el.style.color = ok ? "#1d9e75" : "#d4537e";
}

async function errDetail(r){
  try { return (await r.json()).detail || "操作失败"; } catch { return "操作失败"; }
}

async function loadUsers(){
  const r = await fetch("/admin/users");
  if (r.status === 401){ window.location.href = "/login"; return; }
  if (!r.ok) return;
  const d = await r.json();
  document.getElementById("t-admin").innerHTML =
    "<table><thead><tr><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead><tbody>" +
    d.users.map(u => {
      const isSelf = u.username === USER.name;
      const pen = `<a href="#" class="op rename-pen" data-op="rename" data-u="${esc(u.username)}" title="改名" aria-label="改名">${PEN}</a>`;
      const ops = [];
      ops.push(`<a href="#" class="op" data-op="pw" data-u="${esc(u.username)}" style="color:#3b7ddd;text-decoration:none">重置密码</a>`);
      if (!isSelf) ops.push(`<a href="#" class="op" data-op="role" data-u="${esc(u.username)}" data-role="${u.role === "admin" ? "user" : "admin"}" style="color:#3b7ddd;text-decoration:none">${u.role === "admin" ? "设为普通用户" : "设为管理员"}</a>`);
      if (!isSelf) ops.push(`<a href="#" class="op" data-op="del" data-u="${esc(u.username)}" style="color:#d4537e;text-decoration:none">删除</a>`);
      return `<tr><td>${esc(u.username)}${isSelf ? ' <span class="pill">我</span>' : ""}${pen}</td>` +
        `<td>${u.role === "admin" ? "管理员" : "普通用户"}</td>` +
        `<td class="muted">${esc(u.created_at)}</td>` +
        `<td>${ops.map(o => `<span class="opw">${o}</span>`).join("")}</td></tr>`;
    }).join("") + "</tbody></table>";
}

document.addEventListener("click", async (ev) => {
  const a = ev.target.closest(".op");
  if (!a) return;
  ev.preventDefault();
  const u = a.dataset.u, op = a.dataset.op;
  let url, body;
  if (op === "pw"){
    const pw = prompt(`为 ${u} 设置新密码（至少 8 位）：`);
    if (!pw) return;
    url = `/admin/users/${encodeURIComponent(u)}/password`; body = { password: pw };
  } else if (op === "role"){
    url = `/admin/users/${encodeURIComponent(u)}/role`; body = { role: a.dataset.role };
  } else if (op === "rename"){
    const nn = prompt(`将用户 ${u} 改名为：（其历史调用记录会一并迁移）`);
    if (!nn || nn.trim() === u) return;
    url = `/admin/users/${encodeURIComponent(u)}/rename`; body = { username: nn };
  } else {
    if (!confirm(`确定删除用户 ${u}？账号不可恢复，历史调用记录保留。`)) return;
    url = `/admin/users/${encodeURIComponent(u)}/delete`; body = undefined;
  }
  const r = await api(url, body);
  adminMsg(r.ok ? "操作成功" : await errDetail(r), r.ok);
  if (r.ok){
    loadUsers();
    if (op === "rename" && u === USER.name) window.location.reload();
  }
});

document.getElementById("nu-add").onclick = async () => {
  const body = { username: document.getElementById("nu-name").value.trim(),
                 password: document.getElementById("nu-pass").value,
                 role: document.getElementById("nu-role").value };
  const r = await api("/admin/users", body);
  adminMsg(r.ok ? "用户已创建" : await errDetail(r), r.ok);
  if (r.ok){
    document.getElementById("nu-name").value = "";
    document.getElementById("nu-pass").value = "";
    loadUsers();
  }
};

document.getElementById("pw-save").onclick = async () => {
  const el = document.getElementById("pw-msg");
  const r = await api("/me/password", { old_password: document.getElementById("pw-old").value,
                                       new_password: document.getElementById("pw-new").value });
  el.textContent = r.ok ? "密码已修改" : await errDetail(r);
  el.style.color = r.ok ? "#1d9e75" : "#d4537e";
  if (r.ok){
    document.getElementById("pw-old").value = "";
    document.getElementById("pw-new").value = "";
  }
};

if (USER && USER.name){
  document.getElementById("user-box").innerHTML =
    `${esc(USER.name)}${isAdmin ? ' <span class="pill">管理员</span>' : ""}` +
    ' · <a href="#" id="lo-link">登出</a>';
  document.getElementById("lo-link").onclick = async (e) => {
    e.preventDefault();
    await fetch("/logout", { method: "POST" });
    window.location.href = "/login";
  };
  if (isAdmin){
    document.getElementById("admin-card").style.display = "";
    loadUsers();
  } else {
    document.getElementById("k-users-card").style.display = "none";
    document.getElementById("tool-user-wrap").style.display = "none";
    document.getElementById("skill-user-wrap").style.display = "none";
    document.getElementById("tab-user").style.display = "none";
  }
}

renderAll(DATA);

document.getElementById("tool-user-sel").addEventListener("change", () => renderToolTab(DATA));
document.getElementById("tool-sel").addEventListener("change", () => renderToolTab(DATA));
document.getElementById("days-sel").addEventListener("change", () => renderToolTab(DATA));
document.getElementById("skill-user-sel").addEventListener("change", () => renderSkillTab(DATA));
document.getElementById("skill-sel").addEventListener("change", () => renderSkillTab(DATA));
document.getElementById("skill-days-sel").addEventListener("change", () => renderSkillTab(DATA));
document.getElementById("user-sel").addEventListener("change", () => {
  selectedUser = document.getElementById("user-sel").value;
  renderUserTab(DATA);
});

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    const name = t.dataset.tab;
    document.getElementById("p-" + name).classList.add("on");
    activeTab = name;
    renderTabCharts(name, DATA);
    setTimeout(resizeAll, 30);
  };
});

setInterval(() => { if (document.getElementById("auto").checked) load(); }, 30000);
</script>
</body>
</html>
